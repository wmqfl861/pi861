name: Pi861 community plugins

on:
  push:
    branches: [feat/pi861-runtime-v1-cloud-20261001]
    paths: ['.github/workflows/pi861-plugins.yml', '.pi/settings.json', 'scripts/check-pi861-plugins.mjs']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi861-plugins-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_ignore_scripts: 'true'
      npm_config_save_exact: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Restore the existing source development environment
        run: |
          mkdir -p .artifacts/pi861-plugins "$RUNNER_TEMP/pi861-plugin-home"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi861-plugin-home" >> "$GITHUB_ENV"
          node scripts/pi861-dev.mjs setup 2>&1 | tee .artifacts/pi861-plugins/setup.log
      - name: Install the four reviewed versions through the source Pi CLI
        run: |
          for spec in pi-mcp-adapter@5.0.0 pi-subagents@0.74.0 pi-web-access@0.35.0 pi-hermes-memory@0.9.9; do
            package="${spec%@*}"
            npm view "$spec" --json > ".artifacts/pi861-plugins/$package.metadata.json"
            bash ./pi-test.sh --no-env install --approve -l "npm:$spec" 2>&1 | tee ".artifacts/pi861-plugins/$package.install.log"
          done
          bash ./pi-test.sh --no-env list --approve 2>&1 | tee .artifacts/pi861-plugins/list.log
      - name: Check plugin loading and real SQLite memory without external services
        run: node node_modules/tsx/dist/cli.mjs --tsconfig tsconfig.json scripts/check-pi861-plugins.mjs 2>&1 | tee .artifacts/pi861-plugins/verification.log
      - name: Run the complete repository check
        run: npm run check 2>&1 | tee .artifacts/pi861-plugins/repository-check.log
      - name: Reject changes to committed configuration and source
        run: git diff --exit-code
      - name: Preserve version and resolved dependency evidence
        if: always()
        run: |
          git rev-parse HEAD > .artifacts/pi861-plugins/head.txt
          cp .pi/settings.json .artifacts/pi861-plugins/settings.json
          if test -f .pi/npm/package-lock.json; then
            cp .pi/npm/package-lock.json .artifacts/pi861-plugins/installed-package-lock.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pi861-plugins-evidence-${{ github.sha }}
          path: .artifacts/pi861-plugins/
          if-no-files-found: error
          retention-days: 14
