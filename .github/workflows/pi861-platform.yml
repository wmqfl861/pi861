name: Pi861 Platform

on:
  push:
    branches: [feat/pi861-platform-v1]
  pull_request:
    branches: [main]
    paths:
      - extensions/pi861/**
      - .github/workflows/pi861-platform.yml
      - biome.json
      - PI861_PLAN.md

permissions:
  contents: read

concurrency:
  group: pi861-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pi861_test
          POSTGRES_USER: pi861_test
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi861_test -d pi861_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/pi861/package-lock.json
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install isolated platform dependencies
        run: npm ci --prefix extensions/pi861 --ignore-scripts
      - name: Hydrate upstream model data
        run: npm run hydrate:model-data
      - name: Repository checks
        run: npm run check
      - name: Platform type check
        run: npm run check --prefix extensions/pi861
      - name: Platform regression and disposable PostgreSQL tests
        env:
          PI_OFFLINE: "1"
          PI861_TEST_POSTGRES: "1"
          PI861_TEST_DATABASE_URL: postgresql://pi861_test:ephemeral-ci-only@127.0.0.1:5432/pi861_test
        run: npm run test --prefix extensions/pi861
      - name: Reject implicit formatting changes
        run: git diff --exit-code -- extensions/pi861 biome.json
